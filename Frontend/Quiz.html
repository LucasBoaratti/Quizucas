<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Quizucas - Quizes</title>
        <link rel="stylesheet" href="./CSS/Quiz.css">
        <link rel="shortcut icon" href="./Assets/Favicon.ico" type="image/x-icon">
    </head>
    <body class="conteudoPrincipal">
        <main>
            <section class="logo">
                <img src="./Assets/Elements/Gato.png" alt="Gato">
                <img src="./Assets/Logomarca.png" alt="Logomarca da Quizucas">
                <img src="./Assets/Elements/Nuvens.png" alt="Nuvens" class="nuvensFlutuantes">
            </section>
            <h1 class="titulo">Agora, selecione um quiz referente a categoria e divirta-se!</h1>
            <div class="voltar">
                <a href="./Home.html" class="linkVoltar">Voltar</a>
            </div>
            <section id="quizes" class="quizesGrid">
                <template id="cards">
                    <div class="card">
                        <img class="imagemQuiz">
                        <h2 class="nomeQuiz"></h2>
                        <p class="descricaoQuiz"></p>
                        <button type="button" class="botaoQuiz">Jogar</button>
                    </div>
                </template>
            </section>

            <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.20.0/axios.min.js"></script>
            <script src="./JavaScript/Quiz.js"></script>
        </main>
    </body>
</html>
