<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Quizucas - Vitória</title>
        <link rel="stylesheet" href="./CSS/Vitória.css">
        <link rel="shortcut icon" href="./Assets/Favicon.ico" type="image/x-icon">
    </head>
    <body class="conteudoPrincipal">
        <main>
            <div class="venceu">
                <img src="./Assets/Elements/Vitória.png" alt="Você venceu!">
            </div>
            <div class="quizCompletado">
                <img src="./Assets/Elements/Estrela.png" alt="Estrela" class="estrela">
                <p class="textoCompletado">Meus parabéns, meu(inha) jogador(a) você completou o quiz com sucesso!!!</p>
                <img src="./Assets/Elements/Gato.png" alt="gato" class="gato">
            </div>
            <div class="botoes">
                <button type="button" id="botaoJogarNovamente">Jogar novamente</button>
                <button type="button" class="botao" onclick="window.location.href = './Home.html'">Voltar para o início</button>
            </div>

            <script src="./JavaScript/Vitória.js"></script>
        </main>
    </body>
</html>
