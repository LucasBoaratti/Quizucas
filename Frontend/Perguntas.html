<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Quizucas - Perguntas</title>
        <link rel="stylesheet" href="./CSS/Perguntas.css">
        <link rel="shortcut icon" href="./Assets/Favicon.ico" type="image/x-icon">
    </head>
    <body class="conteudoPrincipal">
        <main>
            <section class="elementosTopo">
                <img src="./Assets/Elements/Estrela.png" alt="Estrela" class="estrela">
                <img src="./Assets/Logomarca.png" alt="Logomarca Quizucas">
                <img src="./Assets/Elements/Foguete.png" alt="Foguete">
            </section>

            <section class="perguntas">
                <div class="voltar">
                    <!-- Criando um link de voltar para a tela de quizzes, diretamente no javascript -->
                </div>
                <p id="pergunta"></p>
                <div class="coracoes">
                    <!-- OBS: As vidas são geradas a partir do javascript :) -->
                </div>
                <div class="alternativas">
                    <template id="hexagono">
                        <button type="button" class="opcao">
                            <p class="alternativa"></p>
                        </button>
                    </template>
                </div>
            </section>

            <!-- Modal de acerto da pergunta -->
            <dialog class="modalAcerto">
                <h1>Resposta correta!</h1>
            </dialog>

            <!-- Modal de erro da pergunta -->
            <dialog class="modalErro">
                <h1>Resposta errada!</h1>
            </dialog>

            <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.20.0/axios.min.js"></script>
            <script src="./JavaScript/Alternativas.js"></script>
            <script src="./JavaScript/Perguntas.js"></script>
        </main>
    </body>
</html>
